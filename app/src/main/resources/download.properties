# Download Config for the Minecraft wrapper.
#
# Single source of truth for the two runtime directory names, plus the
# download URLs and recognition patterns for the server jar and the four
# required plugin jars. Loaded from the classpath by DownloadConfig and
# validated before any directory is resolved or any download is attempted.
#
# The wrapper holds no hardcoded directory-name, URL, or regex literal in
# compiled code; every such value is read from this file. The defaults below
# (mclovers / resources) document the intended directory names shipped here;
# they are not behavioral fallbacks.
#
# There are intentionally no `.target` keys: each artifact keeps the
# Original_Filename it is downloaded and recognized under (derived from the
# HTTP Content-Disposition header, else the final redirected URL segment),
# so injected filenames are never fixed by config.
#
# Backslashes in the pattern values are doubled (\\.) because java.util.Properties
# consumes a single backslash on load; the doubled form yields the literal `\.`
# that Pattern.compile then treats as an escaped dot.

# ---------------------------------------------------------------------------
# Directory_Name_Config
# ---------------------------------------------------------------------------
# Base Runtime Directory name: resolved as <user.home>/<base.dir.name>.
base.dir.name=mclovers-server
# Staging Directory name: resolved as <user.home>/<staging.dir.name>,
# wiped and recreated on every run.
staging.dir.name=mclovers-resources

# ---------------------------------------------------------------------------
# Server jar (Purpur latest build for the pinned Minecraft version).
# The Purpur v2 API redirects to the versioned jar (e.g. purpur-1.21.4-2367.jar),
# which the pattern below recognizes.
# ---------------------------------------------------------------------------
server.url=https://api.purpurmc.org/v2/purpur/1.21.4/latest/download
server.pattern=^purpur-.*\\.jar$

# ---------------------------------------------------------------------------
# Plugin jars.
# GeyserMC and Floodgate expose stable "latest build" spigot download endpoints
# that redirect to the versioned jar. ViaVersion and ViaBackwards are fetched
# from Hangar by explicit current release version (5.11.0), PAPER platform.
# ---------------------------------------------------------------------------
plugin.geyser.url=https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot
plugin.geyser.pattern=^Geyser-Spigot.*\\.jar$

plugin.floodgate.url=https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot
plugin.floodgate.pattern=^floodgate-spigot.*\\.jar$

plugin.viaversion.url=https://hangar.papermc.io/api/v1/projects/ViaVersion/versions/5.11.0/PAPER/download
plugin.viaversion.pattern=^ViaVersion.*\\.jar$

plugin.viabackwards.url=https://hangar.papermc.io/api/v1/projects/ViaBackwards/versions/5.11.0/PAPER/download
plugin.viabackwards.pattern=^ViaBackwards.*\\.jar$
