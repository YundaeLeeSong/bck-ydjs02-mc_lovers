name: Release App Bundle
on:
  push:
    tags:
      - 'v*'

jobs:
  # ------------------------------------------------------------------
  # 1. Build for Windows
  # ------------------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with JPackage
        run: ./gradlew jpackage

      - name: Archive Bundle (Zip)
        run: |
          cd app/build/dist
          Compress-Archive -Path mc-lovers -DestinationPath mc-lovers-windows.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mc-lovers-windows
          path: app/build/dist/mc-lovers-windows.zip

  # ------------------------------------------------------------------
  # 2. Build for Ubuntu (Generic Linux)
  # ------------------------------------------------------------------
  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with JPackage
        run: ./gradlew jpackage

      - name: Archive Bundle (Tar)
        run: |
          cd app/build/dist
          tar -czvf mc-lovers-ubuntu.tar.gz mc-lovers

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mc-lovers-ubuntu
          path: app/build/dist/mc-lovers-ubuntu.tar.gz

  # ------------------------------------------------------------------
  # 3. Build for MacOS
  # ------------------------------------------------------------------
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with JPackage
        run: ./gradlew jpackage

      - name: Archive Bundle (Zip)
        run: |
          cd app/build/dist
          zip -r mc-lovers-macos.zip mc-lovers.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mc-lovers-macos
          path: app/build/dist/mc-lovers-macos.zip

  # ------------------------------------------------------------------
  # 4. Build for Oracle Linux (Containerized)
  # ------------------------------------------------------------------
  build-oracle-linux:
    runs-on: ubuntu-latest
    container: oraclelinux:9
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        # Install Java 21, jmods (crucial for jlink/jpackage), tar, and build utils
        run: |
          dnf update -y
          dnf install -y java-21-openjdk-devel java-21-openjdk-jmods tar gzip binutils findutils

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with JPackage
        run: ./gradlew jpackage

      - name: Archive Bundle (Tar)
        run: |
          cd app/build/dist
          tar -czvf mc-lovers-oracle-linux.tar.gz mc-lovers

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mc-lovers-oracle-linux
          path: app/build/dist/mc-lovers-oracle-linux.tar.gz

  # ------------------------------------------------------------------
  # 5. Create GitHub Release
  # ------------------------------------------------------------------
  release:
    needs: [build-windows, build-ubuntu, build-macos, build-oracle-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: mc-lovers-windows
          path: artifacts/windows

      - name: Download Ubuntu Artifact
        uses: actions/download-artifact@v4
        with:
          name: mc-lovers-ubuntu
          path: artifacts/ubuntu

      - name: Download MacOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: mc-lovers-macos
          path: artifacts/macos

      - name: Download Oracle Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: mc-lovers-oracle-linux
          path: artifacts/oracle

      - name: Publish Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/windows/mc-lovers-windows.zip
            artifacts/ubuntu/mc-lovers-ubuntu.tar.gz
            artifacts/macos/mc-lovers-macos.zip
            artifacts/oracle/mc-lovers-oracle-linux.tar.gz
