name: Release App Bundle
on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Gradle
        run: ./gradlew jar --no-daemon

      - name: Create Self-Contained Bundle (jpackage)
        run: |
          # Create a directory for input jars
          mkdir -p input-libs
          cp build/libs/*.jar input-libs/
          
          # Run jpackage to create a runtime + executable
          # --type app-image creates a folder you can just zip and run
          jpackage \
            --type app-image \
            --dest dist \
            --name mc-lovers \
            --input input-libs \
            --main-jar $(ls input-libs | head -n 1) \
            --main-class your.main.ClassName \
            --verbose

      - name: Archive Bundle
        run: tar -czvf mc-lovers-linux.tar.gz -C dist/mc-lovers .

      - name: Upload Release
        uses: softprops/action-gh-release@v1
        with:
          files: mc-lovers-linux.tar.gz