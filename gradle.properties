# Gradle build properties.
#
# Java toolchain auto-detection is disabled because Gradle's Windows JDK
# discovery walks the Windows registry via a native integration, and on some
# environments (notably IntelliJ's bundled Gradle running under a JBR where the
# native registry service is unavailable) that probe throws
# "WindowsRegistry is not supported on this operating system" before any
# compilation runs. With auto-detect off, Gradle satisfies the Java 21
# toolchain from the JDK it is already running on (the Gradle JVM), so the
# build must be launched with a Java 21 JDK.
#
# - auto-detect=false : do not enumerate installed JDKs (skips the registry walk)
# - auto-download=false: do not fetch a toolchain over the network
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.auto-download=false
